<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorong Gelap</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Courier New', Courier, monospace;
      color: #888;
    }

    #start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      background: #020202;
      cursor: pointer;
    }

    #start-screen h1 {
      color: #bbb;
      font-size: 1.6rem;
      letter-spacing: 3px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    #start-screen p {
      font-size: 0.85rem;
      color: #555;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    #ui-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #666;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
      z-index: 5;
    }

    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      height: 300px;
      background: #000;
      border: 1px solid #222;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #controls {
      width: 100%;
      max-width: 600px;
      text-align: center;
      font-size: 0.8rem;
      color: #444;
      z-index: 5;
    }

    #jumpscare-overlay {
      position: absolute;
      inset: 0;
      background-color: #000;
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
    }

    #jumpscare-svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(220%) brightness(140%);
    }

    .shake {
      animation: heavy-shake 0.04s infinite;
    }

    .strobe {
      animation: strobe-bg 0.03s infinite;
    }

    @keyframes heavy-shake {
      0% { transform: translate(0, 0) scale(1.25); }
      25% { transform: translate(-35px, 25px) scale(1.3) rotate(-4deg); }
      50% { transform: translate(30px, -20px) scale(1.2) rotate(4deg); }
      75% { transform: translate(-25px, -30px) scale(1.28) rotate(-2deg); }
      100% { transform: translate(35px, 20px) scale(1.25) rotate(3deg); }
    }

    @keyframes strobe-bg {
      0% { background-color: #100; }
      25% { background-color: #000; }
      50% { background-color: #fff; }
      75% { background-color: #200; }
      100% { background-color: #000; }
    }
  </style>
</head>
<body>

  <div id="start-screen">
    <h1>Eksplorasi Lorong</h1>
    <p>[ Klik untuk Mulai | Gunakan Spasi / Tap untuk Melompat ]</p>
  </div>

  <div id="game-container">
    <div id="ui-bar">
      <span>JARAK: <span id="distance">0</span>m</span>
      <span>STATUS: AMAN</span>
    </div>

    <div id="canvas-container">
      <canvas id="gameCanvas" width="600" height="300"></canvas>
    </div>

    <div id="controls">
      Tekan Spasi atau Sentuh Layar untuk Melompati Rintangan
    </div>
  </div>

  <!-- Kuntilanak Jumpscare Overlay -->
  <div id="jumpscare-overlay">
    <svg id="jumpscare-svg" viewBox="0 0 500 500">
      <rect width="500" height="500" fill="#000" />
      <!-- Kain Kafan / Badan Pucat -->
      <path d="M 120 120 Q 250 40 380 120 Q 440 380 250 490 Q 60 380 120 120 Z" fill="#e0e8e0" opacity="0.9" />
      <!-- Rambut Hitam Panjang Berantakan Menutupi Samping -->
      <path d="M 100 100 Q 150 250 90 400 Q 120 420 160 300 Q 140 150 180 100 Z" fill="#0a0a0a" />
      <path d="M 400 100 Q 350 250 410 400 Q 380 420 340 300 Q 360 150 320 100 Z" fill="#0a0a0a" />
      <!-- Mata Kosong Hitam Pekat & Lingkaran Merah -->
      <ellipse cx="180" cy="190" rx="40" ry="50" fill="#000" />
      <ellipse cx="320" cy="190" rx="40" ry="50" fill="#000" />
      <circle cx="180" cy="195" r="5" fill="#ff0000" />
      <circle cx="320" cy="195" r="5" fill="#ff0000" />
      <!-- Mulut Menganga Lebar Mengerikan -->
      <path d="M 160 300 Q 250 220 340 300 Q 380 440 250 455 Q 120 440 160 300 Z" fill="#000" />
      <!-- Gigi Runcing Tajam Berdarah -->
      <polygon points="180,300 195,340 210,300" fill="#fff" />
      <polygon points="215,300 230,345 245,300" fill="#fff" />
      <polygon points="255,300 270,340 285,300" fill="#fff" />
      <polygon points="290,300 305,345 320,300" fill="#fff" />
    </svg>
  </div>

  <script>
    const startScreen = document.getElementById('start-screen');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const distanceEl = document.getElementById('distance');
    const jumpscareOverlay = document.getElementById('jumpscare-overlay');

    let audioCtx = null;
    let gameRunning = false;
    let distance = 0;
    let scoreTimer = null;

    // Player Object
    let player = {
      x: 60,
      y: 220,
      width: 24,
      height: 40,
      vy: 0,
      gravity: 0.8,
      jumpForce: -12,
      grounded: true
    };

    // Obstacles Array
    let obstacles = [];
    let obstacleTimer = 0;
    const triggerDistance = 45; // Jumpscare triggers at 45 meters

    startScreen.addEventListener('click', () => {
      startScreen.style.display = 'none';
      initAudio();
      startGame();
    });

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playJumpSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function triggerJumpscareAudio() {
      if (!audioCtx) return;

      // Screech
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(3200, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(500, audioCtx.currentTime + 1.5);
      gain.gain.setValueAtTime(1.0, audioCtx.currentTime);

      // Noise burst
      const bufferSize = audioCtx.sampleRate * 1.5;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      noise.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      osc.start();
      noise.start();
    }

    // Controls
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener('click', () => {
      jump();
    });

    function jump() {
      if (!gameRunning) return;
      if (player.grounded) {
        player.vy = player.jumpForce;
        player.grounded = false;
        playJumpSound();
      }
    }

    function startGame() {
      gameRunning = true;
      distance = 0;
      obstacles = [];
      
      scoreTimer = setInterval(() => {
        if (!gameRunning) return;
        distance++;
        distanceEl.textContent = distance;

        // Trigger jumpscare condition
        if (distance >= triggerDistance) {
          triggerJumpscare();
        }
      }, 150);

      requestAnimationFrame(update);
    }

    function update() {
      if (!gameRunning) return;

      // Clear Canvas
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Floor Line
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 260);
      ctx.lineTo(600, 260);
      ctx.stroke();

      // Update Player Physics
      player.vy += player.gravity;
      player.y += player.vy;

      if (player.y > 220) {
        player.y = 220;
        player.vy = 0;
        player.grounded = true;
      }

      // Draw Player (Silhouette figure)
      ctx.fillStyle = '#666';
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // Spawn Obstacles
      obstacleTimer++;
      if (obstacleTimer > 90) {
        obstacles.push({
          x: canvas.width,
          y: 230,
          width: 20,
          height: 30
        });
        obstacleTimer = 0;
      }

      // Update & Draw Obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= 5;

        ctx.fillStyle = '#333';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        // Collision Check
        if (
          player.x < obs.x + obs.width &&
          player.x + player.width > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.height > obs.y
        ) {
          // Hit obstacle -> Trigger jumpscare instantly
          triggerJumpscare();
          return;
        }

        // Remove offscreen obstacles
        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
        }
      }

      if (gameRunning) {
        requestAnimationFrame(update);
      }
    }

    function triggerJumpscare() {
      if (!gameRunning) return;
      gameRunning = false;
      clearInterval(scoreTimer);

      jumpscareOverlay.style.display = 'flex';
      jumpscareOverlay.classList.add('strobe', 'shake');
      triggerJumpscareAudio();

      if ("vibrate" in navigator) {
        navigator.vibrate([600, 100, 600, 100, 1000]);
      }
    }
  </script>
</body>
</html>
